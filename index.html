<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Animierte Uhr</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #fafafa;
  }

 
  #clock-container {
    display: flex;
    font-size: 80px;
    font-weight: bold;
    color: #333;
    height: 1em; 
    overflow: hidden;
  }

 
  .digit-window {
    position: relative;
    width: 0.6em; 
    height: 1em;
  }

 
  .digit-strip {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
   
    transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
  }

 
  .number {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 1em;
    line-height: 1em;
  }


  .colon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 0.3em;
    height: 1em;
    padding-bottom: 0.1em;
  }
</style>
</head>
<body>

<div id="clock-container">
  </div>

<script>
  const clockContainer = document.getElementById('clock-container');
  const strips = []; 

  
  function initClock() {
   
    const layout = ['digit', 'digit', 'colon', 'digit', 'digit', 'colon', 'digit', 'digit'];

    layout.forEach(type => {
      if (type === 'digit') {
       
        const windowDiv = document.createElement('div');
        windowDiv.className = 'digit-window';
        
      
        const stripDiv = document.createElement('div');
        stripDiv.className = 'digit-strip';
        
       
        for (let i = 0; i <= 9; i++) {
          const numberDiv = document.createElement('div');
          numberDiv.className = 'number';
          numberDiv.innerText = i;
          stripDiv.appendChild(numberDiv);
        }
        
        windowDiv.appendChild(stripDiv);
        clockContainer.appendChild(windowDiv);
        strips.push(stripDiv);
      } else {
      
        const colonDiv = document.createElement('div');
        colonDiv.className = 'colon';
        colonDiv.innerText = ':';
        clockContainer.appendChild(colonDiv);
      }
    });
  }

 
  function updateClock() {
    const now = new Date();
    const h = checkTime(now.getHours());
    const m = checkTime(now.getMinutes());
    const s = checkTime(now.getSeconds());
    
   
    const timeString = `${h}${m}${s}`; 

   
    for (let i = 0; i < timeString.length; i++) {
      const digitValue = parseInt(timeString[i], 10);
    
      strips[i].style.transform = `translateY(-${digitValue}em)`;
    }
    
   
    setTimeout(updateClock, 1000);
  }


  function checkTime(i) {
    return i < 10 ? "0" + i : i.toString();
  }

 
  initClock();
  updateClock();
</script>

</body>
</html>
